<div class="mycard">
    <div class="content">
        <div class="teamName">{{teamName}}</div>
        <div class="line"></div>
        <div class="allCharts">
            <!-- <app-chart *ngFor="let miniGame of teamScore.miniGames" [miniGame]="miniGame"></app-chart> -->
            <div *ngFor="let miniGame of teamScore.miniGames">
                <div class="title">{{getMiniGameName(miniGame.miniGameId)}}</div>
                <div class="chart">
                    <apx-chart
                      [series]="miniGame.statistics"
                      [chart]="chartOptions.chart"
                      [labels]="chartOptions.labels"
                      [fill]="chartOptions.fill"
                      [dataLabels]="chartOptions.dataLabels"
                      [responsive]="chartOptions.responsive"
                    ></apx-chart>
                  </div>
            </div>
