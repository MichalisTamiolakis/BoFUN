<div class="card">
    <div style="display: flex;
    flex-direction: column;
    align-items: center;margin-top: 10px;position: absolute;
    top: 0;">
    <div style="position: relative;border-radius:50%;overflow:hidden;width:75px;height:75px;box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);">
        <span [ngStyle]="{backgroundColor: team.color}" class="iconify team-icon"
            data-icon="fluent:people-team-16-filled"></span>
            <div style="width: 75px;height:75px;background-color:black;position: absolute;top: 60px;">
                <div style="display: flex;
                justify-content: center;
                align-items: center;
                margin-top: 2px;">
                    <span style="width:10px;height:10px;" class="iconify pen" data-icon="fa-solid:pen"></span>
                </div>
            </div>
    </div>
        
        <div *ngIf="!editName" style="display: flex;align-items:center;color: black;margin-top: 3px;">
            <div class="team-name">{{team!==null ? team.name : ''}}</div>
            <div  style="display: flex;width:15px;height:15px;margin-left: 8px;" (click)="toggleEditName()">
                <span class="iconify pen" data-icon="fa-solid:pen"></span>
                
            </div>
            
        </div>

        <input *ngIf="editName" (focusout)="toggleEditName()" autofocus [(ngModel)]="teamName" style="width: 130%;
        box-shadow: rgb(0 0 0 / 25%) 0px 4px 4px;
        border-radius: 30px;
        height: 40px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(28, 32, 32, 0.8) 0%, rgba(43, 47, 47, 0.8) 100%);;
        margin-top: 5%;
        outline: none;" type="text" placeholder="Enter nickname for the team..." [ngModel]="teamName">

    </div>
    <div class="members">
        <div style="font-style: italic;
        font-weight: 300;
        font-size: 16px;
        line-height: 16px;
        display: flex;
        align-items: center;
        text-align: center;
        letter-spacing: -0.02em;">Members:</div>
        <div class="players">

            <div class="player-info" *ngFor="let player of players">
                <!-- <span *ngIf="player.image===''" style="width: 20px;
            height: 20px;color:black;margin-right:5px" class="iconify user-avatar"
                    data-icon="carbon:user-avatar-filled"></span> -->
                    <img style="width: 20px;
                    height: 20px;color:black;margin-right:5px;border-radius: 50%;"  src="{{'data:image/png;base64,'+player.image}}" alt="">
                <div>{{player.username}}</div>
            </div>
        </div>
    </div>



    <!-- <div class="join-button" (click)="emitTeamId()">Join</div> -->

</div>
